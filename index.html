<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Restaurantes en Ejido, Mérida</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <header class="sidebar-header">
      <h1>Restaurantes en Ejido</h1>
      <p class="subtitle">Mérida, Venezuela · <span id="count">30</span> lugares</p>
      <input type="search" id="search" placeholder="Buscar por nombre..." />
      <div class="filters">
        <label><input type="checkbox" id="filter-warnings" /> Solo con ⚠️ para revisar</label>
      </div>
    </header>
    <ul class="place-list" id="place-list"></ul>
  </aside>

  <main class="map-wrap">
    <div id="map"></div>
    <div class="legend">
      <div class="legend-title">Precisión de ubicación</div>
      <div class="legend-item"><span class="dot dot-plus_code"></span> Plus Code decodificado</div>
      <div class="legend-item"><span class="dot dot-coordenadas_gps"></span> Coordenadas GPS del PDF</div>
      <div class="legend-item"><span class="dot dot-aproximada"></span> Aproximada (calle/centro comercial)</div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
